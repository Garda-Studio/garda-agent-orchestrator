# Explicitly authorized manual npm release workflow for Garda Agent Orchestrator.
# The publish job uses npm Trusted Publishing/OIDC to stage the package.
# The public release still requires npm staged approval with maintainer 2FA.
name: Publish

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Exact current owner/repository
        required: true
        type: string
      commit:
        description: Full lowercase SHA of the selected v* tag
        required: true
        type: string
      authorization:
        description: Type I authorize this selected run
        required: true
        type: string
      job:
        description: Validate only, or explicitly validate and stage this candidate
        required: true
        type: choice
        default: validate
        options: [validate, stage-publish]
      os:
        description: Fixed hosted Linux runner
        required: true
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest]
      runtime:
        description: Fixed Node runtime for Trusted Publishing
        required: true
        type: choice
        default: '24'
        options: ['24']
      security_run_id:
        description: Successful exact-commit Security run with npm audit and OSV
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  authorize:
    name: Authorize publish selection
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Authorize selected jobs
        id: selection
        env:
          MANUAL_WORKFLOW: publish
          MANUAL_REPOSITORY: ${{ inputs.repository }}
          MANUAL_COMMIT: ${{ inputs.commit }}
          MANUAL_AUTHORIZATION: ${{ inputs.authorization }}
          MANUAL_JOB: ${{ inputs.job }}
          MANUAL_OS: ${{ inputs.os }}
          MANUAL_RUNTIME: ${{ inputs.runtime }}
        run: node scripts/manual-workflow-authorization.cjs

  validate:
    name: Validate release package
    runs-on: ubuntu-latest
    needs: [authorize]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.selection).jobs.validate.enabled }}
    outputs:
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Publish workflow must run from a v* tag." >&2
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          VERSION_FILE="$(node -e "process.stdout.write(require('node:fs').readFileSync('VERSION', 'utf8').trim())")"

          if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" || "${TAG_VERSION}" != "${LOCK_VERSION}" || "${TAG_VERSION}" != "${LOCK_ROOT_VERSION}" || "${TAG_VERSION}" != "${VERSION_FILE}" ]]; then
            echo "Release tag v${TAG_VERSION} does not match package/version metadata." >&2
            echo "package.json=${PACKAGE_VERSION} package-lock=${LOCK_VERSION} package-lock-root=${LOCK_ROOT_VERSION} VERSION=${VERSION_FILE}" >&2
            exit 1
          fi

          echo "Release tag v${TAG_VERSION} matches package.json, package-lock.json, package-lock root, and VERSION."

      - name: Check publication history before validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-publish-history-evidence.cjs validate
          git update-ref -d "refs/tags/${GITHUB_REF_NAME}"

      - name: Require successful CI for this release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          CI_RUN_ID="$(gh api --hostname github.com --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${GITHUB_SHA}" -f event=workflow_dispatch -f per_page=1 \
            --jq '.workflow_runs[0].id')"
          node scripts/release-candidate.cjs verify-ci "${CI_RUN_ID}" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}"

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Pin release npm CLI
        run: |
          set -euo pipefail
          npm install -g npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Run local release proof
        run: npm run release:preflight

      - name: Pack and attest release candidate
        id: pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_RUN_ID: ${{ inputs.security_run_id }}
        run: |
          set -euo pipefail
          CANDIDATE_DIR="${RUNNER_TEMP}/release-candidate"
          mkdir -p "${CANDIDATE_DIR}"
          npm pack --json --pack-destination "${CANDIDATE_DIR}" > "${CANDIDATE_DIR}/pack-report.json"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          node scripts/release-candidate.cjs create \
            "${CANDIDATE_DIR}/pack-report.json" "${CANDIDATE_DIR}" \
            "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "${GITHUB_OUTPUT}"

          TARBALL_NAME="$(node -p "require(process.argv[1]).tarball_name" "${CANDIDATE_DIR}/candidate-manifest.json")"
          TARBALL_SHA256="$(node -p "require(process.argv[1]).tarball_sha256" "${CANDIDATE_DIR}/candidate-manifest.json")"
          GARDA_RELEASE_CANDIDATE_PATH="${CANDIDATE_DIR}/${TARBALL_NAME}" npm run test:packaging
          node scripts/release-candidate.cjs verify "${CANDIDATE_DIR}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${TARBALL_SHA256}" "${TARBALL_NAME}"
          node scripts/release-security-evidence.cjs attest \
            "${CANDIDATE_DIR}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}" \
            "${TARBALL_SHA256}" "${TARBALL_NAME}" "${GITHUB_REPOSITORY}" "${SECURITY_RUN_ID}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage package on npm
    runs-on: ubuntu-latest
    needs: [authorize, validate]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && needs.validate.result == 'success' && fromJSON(needs.authorize.outputs.selection).jobs['stage-publish'].enabled }}
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin release npm CLI
        run: |
          set -euo pipefail
          npm install -g npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Final publish sanity checks
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          VERSION_FILE="$(node -e "process.stdout.write(require('node:fs').readFileSync('VERSION', 'utf8').trim())")"

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Publish job must run from a v* tag." >&2
            exit 1
          fi
          if [[ "${PACKAGE_NAME}" != "garda-agent-orchestrator" ]]; then
            echo "Unexpected package name: ${PACKAGE_NAME}" >&2
            exit 1
          fi
          if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" || "${TAG_VERSION}" != "${LOCK_VERSION}" || "${TAG_VERSION}" != "${LOCK_ROOT_VERSION}" || "${TAG_VERSION}" != "${VERSION_FILE}" ]]; then
            echo "Release tag v${TAG_VERSION} does not match package/version metadata." >&2
            exit 1
          fi

          node --version
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          test "${NPM_VERSION}" = "11.15.0"
          git update-ref -d "refs/tags/${GITHUB_REF_NAME}"

      - name: Download validated release candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" --name "release-candidate-${GITHUB_SHA}" --dir "${RUNNER_TEMP}/release-candidate"

      - name: Verify downloaded candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.tarball_sha256 }}
          EXPECTED_NAME: ${{ needs.validate.outputs.tarball_name }}
        run: |
          set -euo pipefail
          node scripts/release-candidate.cjs verify \
            "${RUNNER_TEMP}/release-candidate" "${GITHUB_SHA}" "${GITHUB_REF_NAME}" \
            "${EXPECTED_SHA256}" "${EXPECTED_NAME}"
          node scripts/release-security-evidence.cjs verify \
            "${RUNNER_TEMP}/release-candidate" "${GITHUB_SHA}" "${GITHUB_REF_NAME}" \
            "${EXPECTED_SHA256}" "${EXPECTED_NAME}" "${GITHUB_REPOSITORY}"

      - name: Check publication history before staging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-publish-history-evidence.cjs stage-publish

      - name: Stage the validated tarball with npm Trusted Publishing
        shell: bash
        env:
          EXPECTED_NAME: ${{ needs.validate.outputs.tarball_name }}
        run: |
          set -euo pipefail
          npm stage publish "${RUNNER_TEMP}/release-candidate/${EXPECTED_NAME}"
