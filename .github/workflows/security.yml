# Supply-chain security scanning for Garda Agent Orchestrator.
# Jobs: npm audit (high-severity gate) + OSV vulnerability scan (SARIF).
# Manual exact-SHA authorization selects npm audit, OSV, or both.
name: Security

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Exact current owner/repository
        required: true
        type: string
      commit:
        description: Full lowercase SHA of the selected workflow ref
        required: true
        type: string
      authorization:
        description: Type I authorize this selected run
        required: true
        type: string
      job:
        description: Scan selection (all explicitly requests both scans)
        required: true
        type: choice
        default: npm-audit
        options: [npm-audit, osv, all]
      os:
        description: Hosted Linux runner selection
        required: true
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, all]
      runtime:
        description: Node version for authorization and npm audit (OSV uses its pinned scanner runtime)
        required: true
        type: choice
        default: '24'
        options: ['24', all]

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  authorize:
    name: Authorize Security selection
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Authorize selected jobs
        id: selection
        env:
          MANUAL_WORKFLOW: security
          MANUAL_REPOSITORY: ${{ inputs.repository }}
          MANUAL_COMMIT: ${{ inputs.commit }}
          MANUAL_AUTHORIZATION: ${{ inputs.authorization }}
          MANUAL_JOB: ${{ inputs.job }}
          MANUAL_OS: ${{ inputs.os }}
          MANUAL_RUNTIME: ${{ inputs.runtime }}
        run: node scripts/manual-workflow-authorization.cjs

  # ── 1. npm audit — blocks on high-severity advisories ────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    needs: [authorize]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.selection).jobs['npm-audit'].enabled }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin release audit npm CLI
        run: |
          set -euo pipefail
          npm install -g npm@11.15.0 --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund
          test "$(npm --version)" = "11.15.0"

      # Validate the full lockfile graph without executing candidate lifecycle code.
      - name: Install dependencies
        run: npm ci --ignore-scripts --include=prod --include=dev --include=optional --include=peer --registry=https://registry.npmjs.org --no-audit --no-fund

      # Fail the job only on high or critical severity advisories.
      - name: Audit dependencies
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.15.0"
          npm audit --package-lock=true --package-lock-only --ignore-scripts --include=prod --include=dev --include=optional --include=peer --audit-level=high --registry=https://registry.npmjs.org --no-fund

  # ── 2. OSV Scanner — open-source vulnerability database scan ─────────────────
  # Scans package-lock.json against the OSV database (osv.dev).
  # Uses the upstream reusable workflow so SARIF upload and result handling stay
  # aligned with the official OSV Scanner GitHub Action contract.
  osv-scan:
    name: OSV Vulnerability Scan
    needs: [authorize]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.selection).jobs.osv.enabled }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b77c075a1235514558f0eb88dbd31e22c45e0cd2 # v2.3.0
    with:
      ref: ${{ github.sha }}
      scan-args: |-
        --lockfile=package-lock.json
      fail-on-vuln: true
