# CI pipeline for Garda Agent Orchestrator.
# Runs: typecheck/lint → [test-unit | test-gates | test-cli | test-lifecycle | test-bin] → release quality validation → cross-platform smoke.
# Gate and CLI test shards use GARDA_NODE_FOUNDATION_TEST_SHARDS=2 for parallel file execution.
name: CI

on:
  workflow_dispatch:
    inputs:
      section:
        description: Job to run (includes required dependencies); all runs every job
        type: choice
        required: true
        default: typecheck
        options:
          - typecheck
          - test-unit
          - test-gates
          - test-cli
          - test-lifecycle
          - test-bin
          - validate-release
          - smoke
          - all
      validate_release_runner:
        description: Runner for validate-release
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - all
      smoke_runner:
        description: Runner for smoke
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    if: ${{ inputs.section == 'all' || contains(fromJSON('["typecheck","test-unit","test-gates","test-cli","test-lifecycle","test-bin","validate-release","smoke"]'), inputs.section) }}
    name: Static Checks / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

  # ── 2. Unit tests (core, gate-runtime, schemas, validators, etc.) ────────────
  test-unit:
    if: ${{ inputs.section == 'all' || contains(fromJSON('["test-unit","validate-release","smoke"]'), inputs.section) }}
    name: Unit Tests / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build node-foundation
        run: npm run build:node-foundation

      - name: Run unit tests
        env:
          FORCE_COLOR: '1'
        run: npm run test:unit

      - name: Upload node foundation shard logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: node-foundation-shard-logs-test-unit-node-${{ matrix.node-version }}
          path: .node-build/test-shard-logs/**
          if-no-files-found: ignore
          retention-days: 15
          include-hidden-files: true

  # ── 3. Gate tests (next-step, review, routing, workflow evidence) ─────────────
  test-gates:
    if: ${{ inputs.section == 'all' || contains(fromJSON('["test-gates","validate-release","smoke"]'), inputs.section) }}
    name: Gate Tests / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build node-foundation
        run: npm run build:node-foundation

      - name: Run gate tests (parallel shards)
        env:
          FORCE_COLOR: '1'
          GARDA_NODE_FOUNDATION_TEST_SHARDS: '2'
        run: npm run test:gates

      - name: Upload node foundation shard logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: node-foundation-shard-logs-test-gates-node-${{ matrix.node-version }}
          path: .node-build/test-shard-logs/**
          if-no-files-found: ignore
          retention-days: 15
          include-hidden-files: true

  # ── 4. CLI tests (command surfaces, gate flows, review handlers) ──────────────
  test-cli:
    if: ${{ inputs.section == 'all' || contains(fromJSON('["test-cli","validate-release","smoke"]'), inputs.section) }}
    name: CLI Tests / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build node-foundation
        run: npm run build:node-foundation

      - name: Run CLI tests (parallel shards)
        env:
          FORCE_COLOR: '1'
          GARDA_NODE_FOUNDATION_TEST_SHARDS: '2'
        run: npm run test:cli

      - name: Upload node foundation shard logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: node-foundation-shard-logs-test-cli-node-${{ matrix.node-version }}
          path: .node-build/test-shard-logs/**
          if-no-files-found: ignore
          retention-days: 15
          include-hidden-files: true

  # ── 5. Lifecycle tests (setup, update, on/off, uninstall, cleanup) ────────────
  test-lifecycle:
    if: ${{ inputs.section == 'all' || contains(fromJSON('["test-lifecycle","validate-release","smoke"]'), inputs.section) }}
    name: Lifecycle Tests / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build node-foundation
        run: npm run build:node-foundation

      - name: Run lifecycle tests
        env:
          FORCE_COLOR: '1'
        run: npm run test:lifecycle

      - name: Upload node foundation shard logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: node-foundation-shard-logs-test-lifecycle-node-${{ matrix.node-version }}
          path: .node-build/test-shard-logs/**
          if-no-files-found: ignore
          retention-days: 15
          include-hidden-files: true

  # ── 5b. Binary & Materialization tests (bin, materialization) ────────────────
  test-bin:
    if: ${{ inputs.section == 'all' || contains(fromJSON('["test-bin","validate-release","smoke"]'), inputs.section) }}
    name: Binary Tests / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build node-foundation
        run: npm run build:node-foundation

      - name: Run binary tests
        env:
          FORCE_COLOR: '1'
        run: npm run test:bin

      - name: Upload node foundation shard logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: node-foundation-shard-logs-test-bin-node-${{ matrix.node-version }}
          path: .node-build/test-shard-logs/**
          if-no-files-found: ignore
          retention-days: 15
          include-hidden-files: true

  # ── 6. Release validation matrix (version parity + build + quality + pack smoke)
  validate-release:
    if: ${{ inputs.section == 'all' || contains(fromJSON('["validate-release"]'), inputs.section) }}
    name: Release Validation / ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    needs: [test-unit, test-gates, test-cli, test-lifecycle, test-bin]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.validate_release_runner == 'all' && '["ubuntu-latest","windows-latest"]' || format('["{0}"]', inputs.validate_release_runner)) }}
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate release
        run: npm run validate:release:fast

  # ── 7. Cross-platform lifecycle smoke matrix ─────────────────────────────────
  # Runs after all test shards pass. Covers: setup → update git → doctor → uninstall on all 3 OSes.
  smoke:
    if: ${{ inputs.section == 'all' || contains(fromJSON('["smoke"]'), inputs.section) }}
    name: Smoke / ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    needs: [typecheck, test-unit, test-gates, test-cli, test-lifecycle, test-bin]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.smoke_runner == 'all' && '["ubuntu-latest","windows-latest","macos-latest"]' || format('["{0}"]', inputs.smoke_runner)) }}
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Build staged node-foundation test graph
        run: npm run build:node-foundation

      # Pack-install smoke: packs a tarball, installs it, exercises version/help/status.
      - name: Pack and install smoke test
        run: node --test .node-build/tests/node/packaging/pack-smoke.test.js

      # Lifecycle smoke using the local built CLI.
      # Stages map to: setup -> update git -> doctor -> uninstall.
      - name: Lifecycle smoke (cross-platform E2E install → update → uninstall)
        id: lifecycle-smoke
        shell: bash
        run: |
          set -euo pipefail

          SMOKE_DIR="$(mktemp -d)"
          echo "smoke_dir=$SMOKE_DIR" >> "$GITHUB_OUTPUT"
          SMOKE_BRANCH="garda-ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C "$GITHUB_WORKSPACE" branch --force "$SMOKE_BRANCH" "$GITHUB_SHA"
          # Always use absolute paths in cross-platform test to avoid pathing drift
          CLI="node ${GITHUB_WORKSPACE}/bin/garda.js"

          echo "::group::1. Setup (built source checkout)"
          # T-806 makes compile_gate.command fail closed when project discovery
          # cannot prove a compile/build/type-check command. The smoke workspace
          # is synthetic, so seed a tiny project-specific build script before
          # setup and let normal discovery materialize `npm run build`.
          cat > "$SMOKE_DIR/package.json" <<'JSON'
          {"private":true,"scripts":{"build":"node --version"}}
          JSON
          # First-run CI smoke must go through setup so init-answers are materialized
          # non-interactively before install/init/review commands are exercised.
          GIT_URL="file://${GITHUB_WORKSPACE}"
          # Format file URL properly for Windows (file:///D:/...) versus Unix (file:///home/...)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GIT_URL="file:///${GITHUB_WORKSPACE//\\//}"
          fi
          $CLI setup --target-root "$SMOKE_DIR" --no-prompt --assistant-language "English" --assistant-brevity "concise" --source-of-truth "Antigravity" --enforce-no-auto-commit false --claude-orchestrator-full-access false --token-economy-enabled true --active-agent-files ".antigravity/rules.md"
          echo "::endgroup::"

          echo "::group::2. Update (git clone flow)"
          # Exercise git-based update against a local branch anchored to the exact
          # checked-out commit, including detached and shallow pull-request checkouts.
          $CLI update git --target-root "$SMOKE_DIR" --repo-url "$GIT_URL" --branch "$SMOKE_BRANCH" --no-prompt --trust-override
          echo "::endgroup::"

          echo "::group::3. Doctor"
          $CLI doctor --target-root "$SMOKE_DIR"
          echo "::endgroup::"

          echo "::group::4. Uninstall"
          $CLI uninstall --target-root "$SMOKE_DIR" --no-prompt
          echo "::endgroup::"

          rm -rf "$SMOKE_DIR"
          echo "Lifecycle smoke PASSED on $RUNNER_OS"

      # ── Failure forensics: upload runtime evidence and logs ──────────────────
      # Captures build output, runtime state, and npm debug logs when any smoke
      # step fails, giving investigators actionable context without re-running.
      - name: Collect smoke failure evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p smoke-failure-evidence

          # npm debug logs
          for log in "$HOME"/.npm/_logs/*.log; do
            [ -f "$log" ] && cp "$log" smoke-failure-evidence/ || true
          done

          # Build output (dist manifest, compiled CLI entrypoint)
          [ -d dist ] && cp -r dist smoke-failure-evidence/dist || true
          [ -f bin/garda.js ] && cp bin/garda.js smoke-failure-evidence/ || true

          # Lifecycle smoke workspace state (if the step got far enough to create it)
          SMOKE_DIR="${{ steps.lifecycle-smoke.outputs.smoke_dir }}"
          if [ -n "$SMOKE_DIR" ] && [ -d "$SMOKE_DIR" ]; then
            # Capture orchestrator runtime artifacts and agent config
            if [ -d "$SMOKE_DIR/garda-agent-orchestrator/runtime" ]; then
              cp -r "$SMOKE_DIR/garda-agent-orchestrator/runtime" smoke-failure-evidence/smoke-runtime
            fi
            if [ -d "$SMOKE_DIR/garda-agent-orchestrator/live/config" ]; then
              cp -r "$SMOKE_DIR/garda-agent-orchestrator/live/config" smoke-failure-evidence/smoke-config
            fi
            # Capture materialized entrypoints for provider-routing diagnosis
            for f in "$SMOKE_DIR"/.antigravity/rules.md "$SMOKE_DIR"/.agents/workflows/start-task.md; do
              [ -f "$f" ] && cp "$f" smoke-failure-evidence/ || true
            done
          fi

          # Runner environment snapshot
          {
            echo "runner_os=$RUNNER_OS"
            echo "node_version=$(node --version 2>/dev/null || echo 'unavailable')"
            echo "npm_version=$(npm --version 2>/dev/null || echo 'unavailable')"
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo 'unavailable')"
            echo "smoke_dir=$SMOKE_DIR"
          } > smoke-failure-evidence/runner-env.txt

      - name: Upload smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-failure-evidence-${{ matrix.os }}-node${{ matrix.node-version }}
          path: smoke-failure-evidence/
          retention-days: 15
          if-no-files-found: ignore
