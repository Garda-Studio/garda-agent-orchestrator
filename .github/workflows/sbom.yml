# CycloneDX SBOM generation for Garda Agent Orchestrator.
# Generates a Software Bill of Materials in CycloneDX JSON format from
# package-lock.json and uploads it as a build artifact.
# Runs only after explicit manual authorization for the exact run SHA.
name: SBOM

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Exact current owner/repository
        required: true
        type: string
      commit:
        description: Full lowercase SHA of the selected workflow ref
        required: true
        type: string
      authorization:
        description: Type I authorize this selected run
        required: true
        type: string
      job:
        description: Validation selection (all is the same single supported job)
        required: true
        type: choice
        default: sbom
        options: [sbom, all]
      os:
        description: Hosted Linux runner selection
        required: true
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, all]
      runtime:
        description: Node version for authorization and validation
        required: true
        type: choice
        default: '24'
        options: ['24', all]

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  authorize:
    name: Authorize SBOM selection
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Authorize selected jobs
        id: selection
        env:
          MANUAL_WORKFLOW: sbom
          MANUAL_REPOSITORY: ${{ inputs.repository }}
          MANUAL_COMMIT: ${{ inputs.commit }}
          MANUAL_AUTHORIZATION: ${{ inputs.authorization }}
          MANUAL_JOB: ${{ inputs.job }}
          MANUAL_OS: ${{ inputs.os }}
          MANUAL_RUNTIME: ${{ inputs.runtime }}
        run: node scripts/manual-workflow-authorization.cjs

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [authorize]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.selection).jobs['sbom'].enabled }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Ajv is optional to the generator but needed for npm ls; lifecycle scripts stay disabled.
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Generate CycloneDX SBOM
        run: npm run sbom:generate

      - name: Record SBOM toolchain identity
        shell: bash
        run: |
          node - <<'NODE' > sbom-toolchain.json
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          const installed = require('./node_modules/@cyclonedx/cyclonedx-npm/package.json');
          const locked = lock.packages['node_modules/@cyclonedx/cyclonedx-npm'];
          if (!locked?.integrity || manifest.devDependencies['@cyclonedx/cyclonedx-npm'] !== installed.version || locked.version !== installed.version) {
            throw new Error('SBOM generator does not match the locked dev dependency');
          }
          const sha256 = (file) => createHash('sha256').update(readFileSync(file)).digest('hex');
          process.stdout.write(JSON.stringify({
            generator: { name: installed.name, version: installed.version, integrity: locked.integrity },
            lockfile_sha256: sha256('package-lock.json'),
            sbom_sha256: sha256('sbom.cdx.json')
          }, null, 2) + '\n');
          NODE

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: |
            sbom.cdx.json
            sbom-toolchain.json
          retention-days: 90
          if-no-files-found: error
