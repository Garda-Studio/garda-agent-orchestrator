# Secret scanning for Garda Agent Orchestrator.
# Runs gitleaks to detect committed secrets on push, PR, and weekly schedule.
# Complements the runtime redaction layer (T-014) with a prevention gate.
name: Secret Scanning

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - dev
      - 'release/**'
  schedule:
    # Weekly scan: every Monday at 04:00 UTC (offset from security.yml).
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${install_dir}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${install_dir}/${archive}" | sha256sum --check --strict
          tar -xzf "${install_dir}/${archive}" -C "$install_dir" gitleaks
          chmod +x "${install_dir}/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan for secrets
        shell: bash
        run: gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
