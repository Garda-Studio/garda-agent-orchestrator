# Secret scanning for Garda Agent Orchestrator.
# Runs Gitleaks only after explicit manual authorization for the exact run SHA.
# Complements the runtime redaction layer (T-014) with a prevention gate.
name: Secret Scanning

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Exact current owner/repository
        required: true
        type: string
      commit:
        description: Full lowercase SHA of the selected workflow ref
        required: true
        type: string
      authorization:
        description: Type I authorize this selected run
        required: true
        type: string
      job:
        description: Validation selection (all is the same single supported job)
        required: true
        type: choice
        default: gitleaks
        options: [gitleaks, all]
      os:
        description: Hosted Linux runner selection
        required: true
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, all]
      runtime:
        description: Node version for authorization and validation
        required: true
        type: choice
        default: '24'
        options: ['24', all]

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize Secret Scanning selection
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Authorize selected jobs
        id: selection
        env:
          MANUAL_WORKFLOW: secret-scanning
          MANUAL_REPOSITORY: ${{ inputs.repository }}
          MANUAL_COMMIT: ${{ inputs.commit }}
          MANUAL_AUTHORIZATION: ${{ inputs.authorization }}
          MANUAL_JOB: ${{ inputs.job }}
          MANUAL_OS: ${{ inputs.os }}
          MANUAL_RUNTIME: ${{ inputs.runtime }}
        run: node scripts/manual-workflow-authorization.cjs

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    needs: [authorize]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.selection).jobs['gitleaks'].enabled }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${install_dir}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${install_dir}/${archive}" | sha256sum --check --strict
          tar -xzf "${install_dir}/${archive}" -C "$install_dir" gitleaks
          chmod +x "${install_dir}/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan for secrets
        shell: bash
        run: gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
